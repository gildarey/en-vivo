<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En Vivo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #2a2a2e; }

  /* Header fino */
  #header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    height: 34px; padding: 0 10px; background: #151518; color: #ddd; font-size: 13px;
    border-bottom: 1px solid #2a2a2e;
  }
  #header.hidden { display: none; }
  #header button {
    border: 0; border-radius: 5px; cursor: pointer; padding: 2px 7px;
    background: #2c2c32; color: #fff; font-size: 13px; line-height: 1.4;
  }
  #header button:hover { background: #45454d; }
  #header button.on { background: #2ecc71; color: #000; }
  /* margin-right: auto empuja "↻ Todo" y el reloj a la derecha */
  #layouts { display: flex; align-items: center; gap: 3px; white-space: nowrap; margin-right: auto; }
  #layouts .key { color: #777; font-size: 11px; margin-right: 2px; }
  #clock { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .5px; }
  #clock small { color: #888; font-weight: 400; font-size: 11px; margin-left: 4px; }

  /* Aviso fijo abajo; es parte de la columna, así no tapa los cuadros */
  #footer {
    flex: 0 0 auto; padding: 4px 10px; background: #151518; color: #888;
    font-size: 11px; text-align: center; border-top: 1px solid #2a2a2e;
  }

  /* El gap + fondo gris forma el marco fino entre cuadros; columnas/filas las fija setLayout() */
  #grid {
    flex: 1; display: grid;
    gap: 3px; padding: 3px; box-sizing: border-box; min-height: 0;
  }
  .cell { position: relative; display: flex; flex-direction: column; background: #000; border-radius: 4px; overflow: hidden; }
  .cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cell.audio::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px #2ecc71; border-radius: 4px;
  }

  /* Tag del canal, estilo marca de agua */
  .tag {
    position: absolute; left: 14px; bottom: 14px; z-index: 2; pointer-events: none;
    color: rgba(255,255,255,.85); font-weight: 800; font-size: clamp(11px, 1.3vw, 18px);
    letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #e53935; box-shadow: 0 0 4px #e53935; }
  .cell.audio .tag .dot { background: #2ecc71; box-shadow: 0 0 4px #2ecc71; }

  /* Barra fina de controles arriba de cada cuadro (fuera del video, con fondo propio) */
  .tools {
    flex: 0 0 auto; display: flex; justify-content: space-between; gap: 6px;
    padding: 3px 5px; background: #151518;
  }
  .tools .group { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .tools .key { color: #777; font-size: 11px; padding: 0 2px; }
  .tools button, .tools select {
    border: 0; border-radius: 5px; cursor: pointer; padding: 2px 7px;
    background: #2c2c32; color: #fff; font-size: 12px; line-height: 1.4; font-family: inherit;
  }
  .tools button:hover, .tools select:hover { background: #45454d; }
  .tools select { max-width: 150px; min-width: 0; }
  .tools select option { color: #000; }
  .tools button.on { background: #2ecc71; color: #000; }
  /* Zona del video, debajo de la barra; el iframe, el tag y el aviso se posicionan sobre ella */
  .screen { position: relative; flex: 1; min-height: 0; }
  /* Un cuadro agrandado oculta los demás (se descargan y se recargan al volver) */
  .cell.hide { display: none; }

  /* Aviso cuando el canal no transmite o el video no se puede ver */
  .offline {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    background: #111; color: #ccc; font-size: clamp(13px, 1.5vw, 20px);
  }
  .offline small { color: #777; font-size: .7em; }
</style>
</head>
<body>
<div id="header">
  <div id="layouts"><span class="key">Pantallas</span></div>
  <button id="reloadAll" title="Recargar todo">↻ Todo</button>
  <div id="clock"></div>
</div>
<div id="grid"></div>
<div id="footer">
Seguir el juicio político desde un solo lugar, sin saltar entre pestañas. Los videos se reproducen con el reproductor oficial de YouTube, esta página no aloja ni retransmite contenido. Uso personal, sin fines comerciales.</div>

<script src="app.js"></script>
</body>
</html>
