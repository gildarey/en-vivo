<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Paraguay</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: #2a2a2e; }

  /* Header fino */
  #header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    height: 34px; padding: 0 10px; background: #151518; color: #ddd; font-size: 13px;
    border-bottom: 1px solid #2a2a2e;
  }
  #header.hidden { display: none; }
  #channels { display: flex; gap: 14px; flex: 1; overflow: hidden; }
  .ctl { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ctl .key { color: #777; font-size: 11px; }
  #header button {
    border: 0; border-radius: 5px; cursor: pointer; padding: 2px 7px;
    background: #2c2c32; color: #fff; font-size: 13px; line-height: 1.4;
  }
  #header button:hover { background: #45454d; }
  #header button.on { background: #2ecc71; color: #000; }
  #clock { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .5px; }
  #clock small { color: #888; font-weight: 400; font-size: 11px; margin-left: 4px; }

  /* El gap + fondo gris forma el marco fino entre cuadros */
  #grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 3px; padding: 3px; box-sizing: border-box; min-height: 0;
  }
  .cell { position: relative; background: #000; border-radius: 4px; overflow: hidden; }
  .cell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cell.audio::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px #2ecc71; border-radius: 4px;
  }

  /* Tag del canal, estilo marca de agua */
  .tag {
    position: absolute; left: 14px; bottom: 14px; z-index: 2; pointer-events: none;
    color: rgba(255,255,255,.85); font-weight: 800; font-size: clamp(11px, 1.3vw, 18px);
    letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #e53935; box-shadow: 0 0 4px #e53935; }
  .cell.audio .tag .dot { background: #2ecc71; box-shadow: 0 0 4px #2ecc71; }
</style>
</head>
<body>
<div id="header">
  <div id="channels"></div>
  <button id="reloadAll" title="Recargar todo">↻ Todo</button>
  <div id="clock"></div>
</div>
<div id="grid"></div>

<script>
  // ===== CANALES — edita aquí =====
  // channelId: siempre muestra el directo actual del canal (no cambia).
  // videoId:   opcional. Si lo completas, se usa ese video en vez del directo del canal.
  //            Sirve si el directo por canal no carga. Cópialo del link: youtube.com/watch?v=ESTE_ID
  const CHANNELS = [
    { name: 'Monumental 1080', channelId: 'UCApQkTY6oHoGjZr6jfMajwQ', videoId: '' }, // último visto: r7BMMpmwtsg
    { name: 'MEGA TV',         channelId: 'UCfAdi_G2owo819wJsw4OLPQ', videoId: '' }, // último visto: yrqaA-LTbrA
    { name: 'ABC TV',          channelId: 'UCEklbFbPoMaV1ciEb-0mAxg', videoId: '' }, // último visto: koJbtOzjsbI
    { name: 'NPY',             channelId: 'UCXm5UbX1eXIFmFE0lz1etiA', videoId: '' }, // último visto: _ErAcg5qFMo
  ];
  // ================================

  const grid = document.getElementById('grid');
  const channelsBar = document.getElementById('channels');
  const header = document.getElementById('header');
  const players = [];
  let apiReady = false;
  const params = 'autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin);

  CHANNELS.forEach((ch, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    grid.append(cell);

    const ctl = document.createElement('div');
    ctl.className = 'ctl';
    const key = document.createElement('span'); key.className = 'key'; key.textContent = i + 1;
    const name = document.createElement('span'); name.textContent = ch.name;
    const muteBtn = document.createElement('button'); muteBtn.onclick = () => toggle(i);
    const reloadBtn = document.createElement('button'); reloadBtn.textContent = '↻'; reloadBtn.title = 'Recargar'; reloadBtn.onclick = () => load(i);
    ctl.append(key, name, muteBtn, reloadBtn);
    channelsBar.append(ctl);

    players[i] = { cell, muteBtn, muted: true, yt: null };
    load(i);
  });

  // Crea (o recrea) el iframe del cuadro; al recargar vuelve a empezar en mute
  function load(i) {
    const ch = CHANNELS[i];
    const p = players[i];
    if (p.yt) { try { p.yt.destroy(); } catch (e) {} p.yt = null; }
    p.cell.innerHTML = '';

    const iframe = document.createElement('iframe');
    iframe.id = 'player' + i;
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
    iframe.src = ch.videoId
      ? `https://www.youtube.com/embed/${ch.videoId}?${params}`
      : `https://www.youtube.com/embed/live_stream?channel=${ch.channelId}&${params}`;

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.innerHTML = '<span class="dot"></span>';
    tag.append(ch.name);

    p.cell.append(iframe, tag);
    p.muted = true;
    if (apiReady) p.yt = new YT.Player(iframe.id);
    render(i);
  }

  function render(i) {
    const p = players[i];
    p.muteBtn.textContent = p.muted ? '🔇' : '🔊';
    p.muteBtn.classList.toggle('on', !p.muted);
    p.cell.classList.toggle('audio', !p.muted);
  }

  function toggle(i) {
    const p = players[i];
    if (!p.yt) return;
    p.muted ? p.yt.unMute() : p.yt.mute();
    p.muted = !p.muted;
    render(i);
  }

  document.getElementById('reloadAll').onclick = () => players.forEach((_, i) => load(i));

  document.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') { header.classList.toggle('hidden'); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= players.length) toggle(n - 1);
  });

  // Reloj en hora de Paraguay, 24 h
  const clock = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('es-PY', {
    timeZone: 'America/Asuncion', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  const tick = () => { clock.innerHTML = fmt.format(new Date()) + '<small>PY</small>'; };
  tick();
  setInterval(tick, 1000);

  // La API de YouTube se engancha a los iframes para poder controlar el mute
  window.onYouTubeIframeAPIReady = () => {
    apiReady = true;
    players.forEach((p, i) => { p.yt = new YT.Player('player' + i); });
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.append(s);
</script>
</body>
</html>
